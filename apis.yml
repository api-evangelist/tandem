name: Tandem
description: >-
  Tandem is a virtual office for remote and distributed teams, backed by Y Combinator
  and Andreessen Horowitz (a16z), that recreates the presence and spontaneity of an
  in-person office online. It shows who is available and who is in a conversation, and
  lets teammates drop into low-friction voice and video rooms with screen sharing, plus
  integrations with tools like Notion, GitHub, and Trello. Surfaced as a VC-portfolio
  lead and added to the API Evangelist network, Tandem is a consumer/team collaboration
  product with app integrations but no public developer API, OpenAPI specification, or
  developer portal at the time of enrichment (verified 2026-07-21 against https://tandem.chat).
